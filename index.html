<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
</head><body>

<!-- Toolbar -->
<div id="toolbar">
  <input id="search" type="text" placeholder="Search…">
  <div id="gr-wrap">
    <input id="gr-input" type="text" placeholder="Goodreads username or URL">
    <button id="gr-btn">Load shelf</button>
  </div>
  <span id="book-count"></span>
  <button id="share-btn" style="display:none;">Copy link</button>
  <span id="zoom-label">scroll to zoom · drag to pan</span>
</div>

<!-- Viewport -->
<div id="viewport">
<div id="world">

<!-- EXTERIOR -->
<div id="exterior">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="moon">
    <div style="width:100%;height:100%;background:linear-gradient(135deg,#e8e4c8,#d8d4b8);border-radius:50%;box-shadow:0 0 15px rgba(220,216,180,0.15),0 0 50px rgba(220,216,180,0.06);position:relative;overflow:hidden;">
      <div style="position:absolute;top:-6px;right:-4px;width:75%;height:75%;background:#0e1628;border-radius:50%;"></div>
    </div>
  </div>
  <div id="ground"></div>
  <div id="ground-dirt"></div>
  <div id="tree-l">
    <div style="position:relative;width:80px;height:140px;">
      <div style="position:absolute;bottom:0;left:50%;width:12px;height:60px;background:linear-gradient(90deg,#2a1e12,#3a2818,#2a1e12);transform:translateX(-50%);border-radius:2px;"></div>
      <div style="position:absolute;bottom:45px;left:50%;width:65px;height:65px;background:radial-gradient(ellipse,#142a14,#0e220e 55%,transparent 70%);border-radius:50%;transform:translateX(-50%);"></div>
      <div style="position:absolute;bottom:60px;left:30%;width:50px;height:50px;background:radial-gradient(ellipse,#183218,#122612 55%,transparent 70%);border-radius:50%;transform:translateX(-50%);"></div>
      <div style="position:absolute;bottom:55px;left:70%;width:45px;height:45px;background:radial-gradient(ellipse,#142e14,#0e240e 55%,transparent 70%);border-radius:50%;transform:translateX(-50%);"></div>
    </div>
  </div>
  <div id="tree-r">
    <div style="position:relative;width:50px;height:80px;">
      <div style="position:absolute;bottom:0;left:50%;width:8px;height:30px;background:linear-gradient(90deg,#2a1e12,#342418,#2a1e12);transform:translateX(-50%);border-radius:2px;"></div>
      <div style="position:absolute;bottom:22px;left:50%;width:42px;height:42px;background:radial-gradient(ellipse,#142a14,#0e220e 55%,transparent 70%);border-radius:50%;transform:translateX(-50%);"></div>
      <div style="position:absolute;bottom:32px;left:35%;width:32px;height:32px;background:radial-gradient(ellipse,#183218,#122612 55%,transparent 70%);border-radius:50%;transform:translateX(-50%);"></div>
    </div>
  </div>
</div>

<!-- HOUSE -->
<div id="house">
  <div id="roof"></div>
  <div id="chimney">
    <div style="position:relative;">
      <div style="width:20px;height:100%;background:linear-gradient(90deg,#5a4030,#6a5040,#5a4030);"></div>
      <div style="position:absolute;top:0;left:-3px;width:26px;height:5px;background:#6a5040;border-radius:1px;"></div>
    </div>
  </div>
  <div id="attic"></div>
  <div id="attic-box1">
    <div style="width:24px;height:18px;background:linear-gradient(180deg,#5a4a30,#4a3a20);border:1px solid #3a2a18;border-radius:1px;"></div>
  </div>
  <div id="attic-box2">
    <div style="width:18px;height:14px;background:linear-gradient(180deg,#4a4a38,#3a3a28);border:1px solid #2a2a20;border-radius:1px;transform:rotate(5deg);"></div>
  </div>
  <div id="ceiling-beam"></div>
  <div id="kitchen"></div>
  <div id="kitchen-counter">
    <div style="position:relative;width:100%;height:100%;">
      <div style="width:100%;height:100%;background:linear-gradient(180deg,#5a4a2a,#4a3a1a);"></div>
      <div style="position:absolute;top:0;left:-2px;right:-2px;height:5px;background:linear-gradient(180deg,#8a7a5a,#7a6a4a);border-radius:2px;"></div>
      <div style="position:absolute;top:18px;left:20%;width:16px;height:2px;background:#7a6a4a;border-radius:1px;"></div>
      <div style="position:absolute;top:18px;left:50%;width:16px;height:2px;background:#7a6a4a;border-radius:1px;"></div>
    </div>
  </div>
  <div id="kitchen-cabinet">
    <div style="width:100%;height:100%;background:linear-gradient(180deg,#5a4a30,#4a3a20);border:1px solid #3a2a18;border-radius:1px;position:relative;">
      <div style="position:absolute;top:50%;left:30%;width:10px;height:2px;background:#7a6a4a;border-radius:1px;transform:translateY(-50%);"></div>
      <div style="position:absolute;top:50%;right:30%;width:10px;height:2px;background:#7a6a4a;border-radius:1px;transform:translateY(-50%);"></div>
    </div>
  </div>
  <div id="kitchen-table">
    <div style="position:relative;width:100%;height:100%;">
      <div style="position:absolute;top:0;width:100%;height:4px;background:linear-gradient(180deg,#6a5230,#5a4220);border-radius:2px;"></div>
      <div style="position:absolute;top:4px;left:4px;width:3px;height:calc(100% - 4px);background:#5a4220;"></div>
      <div style="position:absolute;top:4px;right:4px;width:3px;height:calc(100% - 4px);background:#5a4220;"></div>
    </div>
  </div>
  <div id="room-divider"></div>
  <div id="house-wall-l"></div>
  <div id="house-wall-r"></div>
  <div id="foundation"></div>
</div>

<!-- ROOM -->
<div id="room">
  <div id="wall"></div>
  <div id="wainscot"></div>
  <div id="floor"></div>
  <div id="baseboard"></div>

  <!-- lamp -->
  <div id="lamp">
    <div style="width:3px;height:120px;background:linear-gradient(180deg,#8a7a5a,#6a5a3a);margin:0 auto;border-radius:1px;"></div>
    <div style="width:60px;height:35px;background:linear-gradient(180deg,#d4c8a0,#c4b888);border-radius:50% 50% 0 0;margin:-2px auto 0;box-shadow:0 -15px 40px rgba(220,200,140,0.15);"></div>
    <div style="width:14px;height:6px;background:#5a4a30;border-radius:2px;margin:0 auto;"></div>
  </div>

  <!-- plant -->
  <div id="plant">
    <div style="width:22px;height:18px;background:linear-gradient(180deg,#6a4a2a,#5a3a1e);border-radius:2px 2px 4px 4px;margin:0 auto;"></div>
    <div style="position:absolute;bottom:16px;left:50%;transform:translateX(-50%);">
      <div style="width:4px;height:20px;background:#3a5a2a;transform:rotate(-15deg);position:absolute;left:-8px;bottom:0;border-radius:2px;"></div>
      <div style="width:4px;height:26px;background:#3a6a2a;position:absolute;left:0;bottom:0;border-radius:2px;"></div>
      <div style="width:4px;height:18px;background:#4a6a30;transform:rotate(20deg);position:absolute;left:8px;bottom:0;border-radius:2px;"></div>
      <div style="width:8px;height:8px;background:#4a7a30;border-radius:50%;position:absolute;left:-12px;bottom:16px;"></div>
      <div style="width:10px;height:10px;background:#3a6a28;border-radius:50%;position:absolute;left:-3px;bottom:22px;"></div>
      <div style="width:7px;height:7px;background:#4a8030;border-radius:50%;position:absolute;left:6px;bottom:14px;"></div>
    </div>
  </div>

  <!-- framed picture -->
  <div id="picture">
    <div style="width:100%;height:100%;background:linear-gradient(135deg,#2a3a2e 0%,#1e2e24 40%,#2a3828 100%);opacity:0.5;"></div>
  </div>

  <!-- armchair -->
  <div id="armchair">
    <div style="position:relative;width:80px;height:70px;">
      <div style="position:absolute;bottom:8px;left:8px;width:64px;height:45px;background:linear-gradient(180deg,#5a3a28,#4a2e20);border-radius:8px 8px 2px 2px;"></div>
      <div style="position:absolute;bottom:8px;left:2px;width:76px;height:22px;background:linear-gradient(180deg,#6a4430,#5a3828);border-radius:4px;"></div>
      <div style="position:absolute;bottom:8px;left:0;width:14px;height:42px;background:linear-gradient(90deg,#5a3828,#6a4430);border-radius:6px 2px 2px 4px;"></div>
      <div style="position:absolute;bottom:8px;right:0;width:14px;height:42px;background:linear-gradient(90deg,#6a4430,#5a3828);border-radius:2px 6px 4px 2px;"></div>
      <div style="position:absolute;bottom:0;left:8px;width:6px;height:10px;background:#3a2418;border-radius:0 0 2px 2px;"></div>
      <div style="position:absolute;bottom:0;right:8px;width:6px;height:10px;background:#3a2418;border-radius:0 0 2px 2px;"></div>
      <div style="position:absolute;bottom:26px;left:14px;width:52px;height:8px;background:linear-gradient(180deg,#6a4a34,#5a3a28);border-radius:3px;opacity:0.6;"></div>
    </div>
  </div>

  <!-- side table -->
  <div id="side-table">
    <div style="position:relative;width:36px;height:44px;">
      <div style="position:absolute;top:0;left:0;width:36px;height:5px;background:linear-gradient(180deg,#6a5230,#5a4220);border-radius:2px;z-index:1;"></div>
      <div style="position:absolute;top:-10px;left:8px;width:10px;height:10px;background:linear-gradient(180deg,#e8e0d0,#d0c8b8);border-radius:1px 1px 2px 2px;"></div>
      <div style="position:absolute;top:-7px;left:18px;width:3px;height:5px;background:transparent;border:1.5px solid #d0c8b8;border-left:none;border-radius:0 3px 3px 0;"></div>
      <div style="position:absolute;top:-4px;right:3px;width:12px;height:3px;background:#4a3a5a;border-radius:1px;transform:rotate(-3deg);"></div>
      <div style="position:absolute;top:5px;left:50%;width:4px;height:30px;background:#5a4220;transform:translateX(-50%);"></div>
      <div style="position:absolute;bottom:0;left:50%;width:28px;height:4px;background:#5a4220;border-radius:2px;transform:translateX(-50%);"></div>
    </div>
  </div>

  <!-- window left -->
  <div id="window-l">
    <div style="position:relative;">
      <div style="width:60px;height:80px;background:#1a2a1e;border:4px solid #5a4a38;border-radius:2px;position:relative;overflow:hidden;">
        <div style="width:100%;height:100%;background:linear-gradient(135deg,#1e3028,#253830 50%,#1a2822);"></div>
        <div style="position:absolute;left:50%;top:0;width:3px;height:100%;background:#5a4a38;transform:translateX(-50%);"></div>
        <div style="position:absolute;top:50%;left:0;width:100%;height:3px;background:#5a4a38;transform:translateY(-50%);"></div>
        <div style="position:absolute;top:6px;left:6px;width:12px;height:16px;background:rgba(180,200,180,0.05);border-radius:50%;"></div>
      </div>
      <div style="width:68px;height:5px;background:linear-gradient(180deg,#6a5838,#5a4828);border-radius:1px;margin:-1px -4px 0;"></div>
      <div style="width:8px;height:22px;background:linear-gradient(90deg,#6a5838,#5a4828);border-radius:0 0 1px 1px;position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);"></div>
    </div>
  </div>

  <!-- window right -->
  <div id="window-r">
    <div style="position:relative;">
      <div style="width:60px;height:80px;background:#1a2a1e;border:4px solid #5a4a38;border-radius:2px;position:relative;overflow:hidden;">
        <div style="width:100%;height:100%;background:linear-gradient(135deg,#1e3028,#253830 50%,#1a2822);"></div>
        <div style="position:absolute;left:50%;top:0;width:3px;height:100%;background:#5a4a38;transform:translateX(-50%);"></div>
        <div style="position:absolute;top:50%;left:0;width:100%;height:3px;background:#5a4a38;transform:translateY(-50%);"></div>
        <div style="position:absolute;top:8px;right:6px;width:10px;height:14px;background:rgba(180,200,180,0.04);border-radius:50%;"></div>
      </div>
      <div style="width:68px;height:5px;background:linear-gradient(180deg,#6a5838,#5a4828);border-radius:1px;margin:-1px -4px 0;"></div>
      <div style="width:8px;height:22px;background:linear-gradient(90deg,#6a5838,#5a4828);border-radius:0 0 1px 1px;position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);"></div>
    </div>
  </div>

  <!-- wall clock -->
  <div id="clock">
    <div style="position:relative;width:32px;height:40px;">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,#e8dcc0,#d4c8a8);border-radius:50%;border:3px solid #5a4a30;box-shadow:2px 2px 6px rgba(0,0,0,0.3);position:relative;">
        <div style="position:absolute;bottom:50%;left:50%;width:1.5px;height:10px;background:#2a1a10;transform-origin:bottom;transform:translateX(-50%) rotate(-30deg);"></div>
        <div style="position:absolute;bottom:50%;left:50%;width:1.5px;height:7px;background:#2a1a10;transform-origin:bottom;transform:translateX(-50%) rotate(80deg);"></div>
        <div style="position:absolute;top:50%;left:50%;width:3px;height:3px;background:#2a1a10;border-radius:50%;transform:translate(-50%,-50%);"></div>
      </div>
      <div style="width:4px;height:10px;background:#5a4a30;margin:0 auto;"></div>
    </div>
  </div>

  <!-- rug -->
  <div id="rug">
    <div style="width:200px;height:36px;background:linear-gradient(90deg,#4a2828,#5a3030 8%,#4a2222 25%,#5a2828 50%,#4a2222 75%,#5a3030 92%,#4a2828);border-radius:2px;border:2px solid #3a1818;box-shadow:inset 0 0 15px rgba(0,0,0,0.3);"></div>
  </div>

  <!-- floor cat -->
  <div id="floor-cat">
    <div style="position:relative;width:28px;height:14px;">
      <div style="width:22px;height:11px;background:linear-gradient(180deg,#4a4040,#3a3030);border-radius:10px 8px 5px 7px;position:absolute;bottom:0;left:0;"></div>
      <div style="width:9px;height:7px;background:#3a3030;border-radius:50%;position:absolute;bottom:4px;right:0;"></div>
      <div style="width:16px;height:1.5px;background:#3a3030;border-radius:2px;position:absolute;bottom:1px;right:-7px;transform:rotate(12deg);"></div>
    </div>
  </div>
</div>

<!-- BOOKSHELF -->
<div id="bookshelf">
  <div id="shelf-back"></div>
  <div id="shelf-left"></div>
  <div id="shelf-right"></div>
  <div id="shelf-top"></div>
  <div id="shelves"></div>
</div>

</div><!-- /world -->
</div><!-- /viewport -->

<div id="tip"></div>
<script src="app.js"></script>
</body></html>
